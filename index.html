<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Halloween Sound DJ</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Halloween DJ</h1>
        </header>

        <main>
            <!-- Background Music Section -->
            <section class="music-section">
                <div class="section-header">
                    <h2>BGM</h2>
                    <div class="music-controls-inline">
                        <button id="btn-prev" class="ctrl-btn" title="Previous">⏮</button>
                        <button id="btn-play" class="ctrl-btn play" title="Play/Pause">▶</button>
                        <button id="btn-next" class="ctrl-btn" title="Next">⏭</button>
                        <button id="btn-stop" class="ctrl-btn" title="Stop">⏹</button>
                        <input type="range" id="bgm-volume" min="0" max="100" value="50" class="vol-slider">
                    </div>
                </div>
                <div class="now-playing">
                    <div class="progress-bar"><div id="progress" class="progress"></div></div>
                    <span id="current-track">Select a track</span>
                </div>
                <div class="music-list" id="music-list">
                    <div class="loading-msg">Loading...</div>
                </div>
            </section>

            <!-- Sound Effects Section -->
            <section class="sfx-section">
                <div class="section-header">
                    <h2>SFX</h2>
                    <input type="range" id="sfx-volume" min="0" max="100" value="70" class="vol-slider">
                </div>
                <div class="sfx-pad" id="sfx-pad">
                    <div class="loading-msg">Loading...</div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
